<!DOCTYPE html>
<html>
<head>
    <title>Opacity and Overflow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Opacity and Overflow</h1>

    <div class="box one">
        Opacity Example
    </div>

    <div class="box two">
        Overflow Hidden
        <p>
            This is some extra text. This text is bigger
            than the box so some part of it will be hidden.
        </p>
    </div>

    <div class="box three">
        Overflow Scroll
        <p>
            This is some extra text. You can scroll inside
            this box to see the remaining content.
        </p>
    </div>

</body>
</html>

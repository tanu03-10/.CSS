<!DOCTYPE html>
<html>

<head>
    <title>CSS Display Property</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <h1>CSS Display Practice</h1>


    <h2>Block Elements</h2>

    <div class="block">
        Block Box 1
    </div>

    <div class="block">
        Block Box 2
    </div>



    <h2>Inline Elements</h2>

    <span class="inline">
        Inline Box 1
    </span>

    <span class="inline">
        Inline Box 2
    </span>



    <h2>Inline Block Elements</h2>

    <div class="card">
        Card 1
    </div>

    <div class="card">
        Card 2
    </div>



    <h2>Display None</h2>

    <p class="hide">
        This text is hidden.
    </p>


</body>

</html>
